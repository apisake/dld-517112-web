server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/json;

  error_page 404 /404.html;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # HTML: ตรวจสอบใหม่ทุกครั้ง เนื้อหาที่แก้จะแสดงทันที
  location ~* \.html$ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache";
  }
  # JS/CSS: แคชสั้น (ชื่อไฟล์ไม่มี hash)
  location ~* \.(css|js)$ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=300";
  }
  # รูปภาพ: แคชยาว
  location ~* \.(png|jpg|jpeg|svg|webp|ico)$ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=604800";
  }
  # ไม่เผยแพร่ไฟล์ภายใน
  location ~ /\.|\.(py|md|json\.bak)$ { return 404; }

  location / {
    include /etc/nginx/conf.d/headers.inc;
    try_files $uri $uri/ $uri/index.html =404;
  }
}
